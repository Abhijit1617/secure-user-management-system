name: backend-control-plane

services:
  postgres:
    image: postgres:17-alpine
    container_name: cp-postgres
    environment:
      POSTGRES_DB: control_plane_db
      POSTGRES_USER: control_plane_user
      POSTGRES_PASSWORD: control_plane_pass
    ports:
      - "5433:5432"
    volumes:
      - cp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane_user -d control_plane_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cp-network

  redis:
    image: redis:8-alpine
    container_name: cp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cp-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: cp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cp-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: cp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - cp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cp-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: control-plane-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    networks:
      - cp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/control_plane_db
      DB_USERNAME: control_plane_user
      DB_PASSWORD: control_plane_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@controlplane.local}
      STORAGE_BASE_PATH: /app/storage
    volumes:
      - cp-attachments:/app/storage
      - cp-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - cp-network

  nginx:
    image: nginx:1.27-alpine
    container_name: cp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cp-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cp-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cp-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cp-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set - see .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
        - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
        - cp-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - cp-network
volumes:
  cp-postgres-data:
  cp-redis-data:
  cp-prometheus-data:
  cp-grafana-data:
  cp-attachments:
  cp-logs:

networks:
  cp-network:
    driver: bridge
