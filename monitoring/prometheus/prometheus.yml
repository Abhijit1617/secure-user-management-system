global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend-control-plane"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "backend-control-plane"
          environment: "docker-compose"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
